plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
if (rootProject.file("local.properties").exists()) {
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))
}
def deepSeekKey = (localProperties.getProperty("DEEPSEEK_API_KEY", "") ?: "").trim()
def geminiKey = (localProperties.getProperty("GEMINI_API_KEY", "") ?: "").trim()

android {
    namespace 'com.nuramin.sunsetcoralcalculator'
    compileSdk 35

    defaultConfig {
        applicationId "com.nuramin.sunsetcoralcalculator"
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName "v3.0.0"
        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${deepSeekKey}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new java.util.Properties()
                keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0-alpha07'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.play:app-update:2.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    // Real org.json implementation for unit tests (Android SDK only provides stubs on JVM)
    testImplementation 'org.json:json:20231013'
}
